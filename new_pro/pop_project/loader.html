<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function run(){
            console.log("succesfully opened...");
            window.location.href="index.html";
        }
        setTimeout(run,5000)
    </script>
</head>
<body>
    <div class="circle"><div class="scircle"></div></div>
    
    <p>Inflating Ballons...</p>
</body>
</html>
<style>
    body {
        background-color: rgba(0, 255, 255, 0.858);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column; /* This stacks items vertically */
    min-height: 100vh;
    margin: 0;
}
    .circle{
        padding: 10px 10px 10px 10px;
        width: 90px;
        height: 90px;
        border-top: 10px solid red;
        border: 10px solid rgb(0, 231, 231);
        background-color: aqua;
        border-radius: 50%;
        transition:animation 1s ease;
        animation:round 1s infinite 0s linear;
    }
    .scircle{
        margin: 6px 5px 9px 5px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border-top:10px solid blue;
        border-top-width: 10px;
        border: 10px solid rgb(0, 231, 231);
        background-color: aqua;
        
        animation:sround 1.4s infinite 0s linear;
        
        
    }

    @keyframes round{
        0%{border-top: 10px solid red;
            transform: rotate(0deg);
            
        }
        30%{border-top: 10px solid red;transform: rotate(90deg);}
        60%{border-top: 10px solid red;transform: rotate(270deg);}
        90%{border-top: 10px solid red;transform: rotate(360deg);}
        100%{border-top: 10px solid red;transform: rotate(360deg);}
    }
    @keyframes sround{
        0%{border-top: 10px solid rgb(217, 255, 0);
            transform: rotate(0deg);
            
        }
        30%{border-top: 10px solid rgb(217, 255, 0);transform: rotate(270deg);}
        60%{border-top: 10px solid rgb(217, 255, 0);transform: rotate(120deg);}
        90%{border-top: 10px solid rgb(217, 255, 0);transform: rotate(90deg);}
        100%{border-top: 10px solid rgb(217, 255, 0);transform: rotate(0deg);}
    }
p{
    color:rgb(4, 0, 255);
    font-size: 2rem;
}
</style>
