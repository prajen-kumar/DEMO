<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CALCULATOR</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=125" />
    <link rel="stylesheet" href="style.css" />
    <script src="caculate.js" defer></script>
  </head>
  <body>

    <h2>Calculator</h2>
  <div id='demo'></div>
<div id="but"><br>
  <input id="result" type="text" name="input" readonly><br><br>
<button data-value="1">1</button>
<button data-value="2">2</button>
<button data-value="3">3</button>
<button data-value="4">4</button>
<button data-value="5">5</button>
<button data-value="6">6</button><br>
<button data-value="7">7</button>
<button data-value="8">8</button>
<button data-value="9">9</button><br>
<button data-value="0">0</button>
<button data-value="+">+</button>
<button data-value="-">-</button><br>
<button data-evaluate="true">=</button>
<button data-value="*">x</button>
<button data-value="/">/</button><br>
<button data-clear="true">ac</button>
<button data-value=".">.</button>
<button data-value="00">00</button>

</div>

  </body>
</html>
